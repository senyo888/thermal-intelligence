<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc">
<title id="title">Thermal Intelligence: devices, sensors and observations</title><desc id="desc">Heating hardware, indoor and outdoor sensors, weather services, room context and energy meters enter Home Assistant through their integrations. A selected climate entity and independent per-card sensor mappings feed separate TI provider and telemetry models. Deliberate user commands return through guarded Home Assistant services to the selected provider. Sensors do not have to pass through the thermostat provider.</desc>
