name: Feature request
description: Suggest a focused improvement and explain the user need.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: Suggestions inform review; votes do not approve scope or delivery dates. Use Community proposal for broader architecture or policy changes.
  - type: textarea
    id: problem
    attributes:
      label: Problem and practical benefit
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component or provider
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement and alternatives
    validations:
      required: true
  - type: textarea
    id: avoid
    attributes:
      label: Behavior to preserve or avoid
      description: Include ownership, unavailable-state or compatibility concerns where relevant.
  - type: textarea
    id: references
    attributes:
      label: Related issues or public-safe examples
