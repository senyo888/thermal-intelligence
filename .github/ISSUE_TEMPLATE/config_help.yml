name: Configuration help
description: Ask about installation or card configuration.
title: "[Help] "
body:
  - type: markdown
    attributes:
      value: |
        TI v0.1.0-rc.2 is a prerelease available through Marketplace or manual installation. Describe the guide and exact version you are using.
        Share only a minimal redacted configuration, never tokens, private URLs or a full HA backup.
  - type: textarea
    id: goal
    attributes:
      label: Intended outcome and current problem
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Versions and setup
      description: TI version or commit, HA/provider versions, Marketplace (formerly HACS) or manual installation, resource loading and browser/Companion. Mark anything not applicable.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal redacted configuration
      render: yaml
  - type: textarea
    id: attempted
    attributes:
      label: Documentation followed and checks already tried
    validations:
      required: true
