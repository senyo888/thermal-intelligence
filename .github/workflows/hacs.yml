name: HACS validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: Validate dashboard plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run the official HACS validator
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
          comment: 'false'
