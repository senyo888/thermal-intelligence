name: Deploy website

on:
  push:
    branches: [main]
    paths: &site_paths
      - 'site/**'
      - 'assets/presentation/*.png'
      - 'docs/wiki/Installing-with-Marketplace.md'
      - 'docs/wiki/Configuration.md'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [develop, main]
    paths: *site_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build static website
        run: |
          python3 -m venv "$RUNNER_TEMP/ti-pages"
          "$RUNNER_TEMP/ti-pages/bin/pip" install --require-hashes -r site/requirements.txt
          "$RUNNER_TEMP/ti-pages/bin/python" scripts/build_site.py
      - name: Upload website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
