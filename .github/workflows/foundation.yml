name: Project checks

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check public foundation
        run: python3 scripts/check_foundation.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned development dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit contracts
        run: npm test
      - name: Build and verify checked-in bundle
        run: |
          npm run build
          git diff --exit-code -- dist/thermal-intelligence.js
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Synthetic browser contracts
        run: npm run test:browser
