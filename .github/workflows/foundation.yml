name: Project checks

on:
  workflow_dispatch:
  push:
    branches: [main, develop, senyo888-patch-1]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check public foundation
        run: python3 scripts/check_foundation.py
      - name: Check public data boundaries
        run: python3 scripts/check_public_data.py
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan tracked files and history with redacted output
        run: |
          scripts/security/scan_secrets.sh tracked
          scripts/security/scan_secrets.sh full-history
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned development dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit contracts
        run: npm test
      - name: Package regression contracts
        run: python3 -B tests/package_test.py
      - name: Build and verify checked-in bundle
        run: |
          npm run build
          git diff --exit-code -- dist/thermal-intelligence.js
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Synthetic browser contracts
        run: npm run test:browser
      - name: Reproduce prerelease package
        run: |
          python3 scripts/package_beta.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/ti-prerelease-a"
          python3 scripts/package_beta.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/ti-prerelease-b"
          diff -ru "$RUNNER_TEMP/ti-prerelease-a" "$RUNNER_TEMP/ti-prerelease-b"
